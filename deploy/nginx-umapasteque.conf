# Nginx site for Umapastèque on the VPS.
# setup-vps.sh copies it to /etc/nginx/sites-available/umapasteque and puts the
# real domain in place of DOMAIN; certbot then adds the HTTPS part.
#
# Files: /var/www/umapasteque/current -> the latest release (see deploy-vps.yml).

# CSS, JS and data URLs carry ?v=<commit> on every deploy (stamp_version.py):
# stamped ones can be cached for good, anything else is checked each time.
map $arg_v $umapasteque_cache {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    root /var/www/umapasteque/current;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        include snippets/umapasteque-headers.conf;
    }

    location ~ \.(css|js|json)$ {
        add_header Cache-Control $umapasteque_cache always;
        include snippets/umapasteque-headers.conf;
    }

    # Pictures are not stamped: a week is enough
    location /assets/ {
        add_header Cache-Control "public, max-age=604800" always;
        include snippets/umapasteque-headers.conf;
    }

    # Hidden files (.git, .github…) are never served
    location ~ /\. { deny all; }
}
