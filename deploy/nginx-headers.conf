# Security headers for Umapastèque, included in every location of the site
# (an add_header inside a location drops the ones set above it).
# Installed by setup-vps.sh as /etc/nginx/snippets/umapasteque-headers.conf.
#
# The admin page keeps the GitHub token in the browser: only scripts from this
# site may run, and they may only talk to this site and api.github.com.
# Images may come from anywhere over https (fallback to the original URL).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://api.github.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
