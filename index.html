<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Umapastèque · End Closer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: compact header + one-line filter bar, then a left-to-right timeline: scenario sections side by side, sticky scenario label, date rail above v1-style cards */
:root{
  color-scheme: dark;
  --bg:#191919; --bar:#1e1e1e; --inset:#ffffff0d; --line:#ffffff17;
  --fg:#e9e6e1; --muted:#9b9893; --faint:#6f6c68; --gold:#e7b84b; --accent:#7fd1a5;
  --t-blue:#1f3045; --t-red:#422622; --t-green:#21362a; --t-orange:#46301c; --t-pink:#43253a; --t-yellow:#433a1c; --t-purple:#2f2645;
  --v5:#a98bf5; --v4:#6aa7f0; --v3:#6cc58f; --v2:#d9b54a; --v1:#8d8a85; --v0:#5d5a56;
  --display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cardw:min(86vw,410px);
  --gut:max(16px,env(safe-area-inset-left,0px));
  --rh:58px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--body)}
small{color:var(--muted)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pad{padding-left:var(--gut);padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.mast{padding-block:18px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.mast h1{font:800 28px/1 var(--display);margin:0}
.mast h1 span{color:var(--accent)}
.crumbs{display:flex;gap:4px;flex-wrap:wrap}
.crumbs a{display:inline-flex;align-items:center;gap:6px;padding:3px 11px 3px 4px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13px}
.crumbs a[aria-current]{background:var(--fg);color:var(--bg)}

/* filter bar */
.bar{background:var(--bar);border-block:1px solid var(--line)}
.bar .pad{padding-block:8px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip .dot{width:7px;height:7px;border-radius:50%}
.types{display:flex;gap:4px;flex-wrap:wrap}
.sel{background:var(--inset);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600}
.sel option{background:#222}
.search{background:var(--inset);border:1px solid var(--line);border-radius:999px;padding:3px 12px;width:160px;min-width:0;font-size:13px}
.sp{flex:1}
.count{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.link{background:none;border:0;color:var(--accent);cursor:pointer;font-weight:700;font-size:12.5px;padding:2px 4px}

/* timeline */
.tl-wrap{position:relative}
.tl{position:relative;display:flex;overflow-x:auto;overscroll-behavior-x:contain;padding-bottom:18px;scrollbar-color:#ffffff30 transparent}
.tl::-webkit-scrollbar{height:10px}.tl::-webkit-scrollbar-thumb{background:#ffffff30;border-radius:5px}
.spacer{flex:0 0 var(--gut)}
.ruler{position:absolute;top:0;left:0;height:var(--rh);border-bottom:1px solid #ffffff40;background:linear-gradient(#232323,#1d1d1d);pointer-events:none}
.ruler .tk{position:absolute;bottom:0;width:1px;background:#ffffff45;height:7px}
.ruler .tk.wk{height:12px;background:#ffffff70}
.ruler .tk.mo{height:22px;background:#ffffffc0}
.ruler .lb{position:absolute;bottom:24px;font:700 11px var(--body);color:var(--muted);transform:translateX(4px);white-space:nowrap;font-variant-numeric:tabular-nums}
.ruler .lb.yr{color:var(--fg)}
.ruler .flag{position:absolute;top:0;bottom:0;border-left:2px solid var(--sc)}
.ruler .flag span{position:absolute;top:4px;left:5px;font:800 11px var(--display);color:var(--sc);white-space:nowrap}
.ruler .now{position:absolute;top:0;bottom:-4px;border-left:2px dashed var(--gold)}
.reader{position:absolute;top:0;left:0;height:var(--rh);display:flex;align-items:stretch;z-index:3;pointer-events:none;padding-left:var(--gut);background:#1b1b1b;border-bottom:1px solid #ffffff40;box-shadow:8px 0 12px -6px #000}
.reader .shot{width:150px;position:relative;margin-block:5px;border-radius:6px;overflow:hidden;background:var(--inset);box-shadow:0 0 0 2px var(--sc,#555)}
.reader .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity .45s,transform .6s}
.reader .shot img.on{opacity:1;transform:none}
.reader .shot b{position:absolute;inset:0;display:grid;place-items:center;font:800 12px var(--display);color:var(--fg);text-align:center;padding:4px;text-shadow:0 1px 3px #000}
.reader .shot img.on~b{opacity:0}
.reader .txt{display:flex;flex-direction:column;justify-content:center;padding:0 40px 0 12px}
.reader .txt b{font:800 15px/1.1 var(--display);color:var(--sc);white-space:nowrap}
.reader .txt small{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.needle{position:absolute;top:0;height:calc(var(--rh) + 8px);border-left:2px solid var(--fg);z-index:3;pointer-events:none}
.needle::after{content:"";position:absolute;bottom:-1px;left:-6px;border:5px solid transparent;border-top:7px solid var(--fg)}
@media (prefers-reduced-motion:reduce){.reader .shot img{transition:none}}
.sc{flex:0 0 auto;display:grid;grid-template-rows:auto 1fr;gap:6px;border-top:4px solid var(--sc);padding-top:10px;margin-top:calc(var(--rh) + 14px)}
.sc-head{position:sticky;left:var(--gut);justify-self:start;display:flex;align-items:baseline;gap:10px;padding-right:16px;white-space:nowrap}
.sc-head h2{margin:0;font:800 22px/1.1 var(--display);color:var(--sc)}
.sc-head small{font-size:12.5px}
.cards{display:flex;gap:14px;padding-right:22px;align-items:start}
.col{flex:0 0 var(--cardw);width:var(--cardw);max-width:var(--cardw);contain:inline-size;display:grid;gap:8px;}
.when{position:relative;height:30px;display:flex;align-items:center;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.when::before{content:"";position:absolute;left:0;right:-14px;top:50%;border-top:1px solid var(--line)}
.when i{position:relative;width:11px;height:11px;border-radius:50%;background:var(--sc);box-shadow:0 0 0 3px var(--bg);margin-right:10px}
.when span{position:relative;background:var(--bg);padding-right:6px}
.when.past{opacity:.55}
.today{flex:0 0 auto;align-self:stretch;display:flex;flex-direction:column;align-items:center;padding-top:6px;margin-right:4px}
.sc-head{visibility:visible}
.today b{font-size:11px;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
.today::after{content:"";flex:1;border-left:2px dashed var(--gold);margin-top:4px}
.nav{position:absolute;top:45%;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#262626e6;cursor:pointer;font-size:20px;line-height:1;display:grid;place-items:center;z-index:2}
.nav.prev{left:max(6px,env(safe-area-inset-left,0px))}.nav.next{right:max(6px,env(safe-area-inset-right,0px))}
.nav:disabled{opacity:0;pointer-events:none}
@media (hover:none){.nav{display:none}}

/* card = v1 callout */
.card{overflow:hidden;background:var(--tint);border-radius:12px;padding:15px;display:grid;gap:10px;min-width:0;border:1px solid #ffffff0a}
.card h3{margin:0;font:700 16.5px/1.25 var(--display)}
.card h3 .sub{color:var(--muted);font-weight:500}
.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;margin-top:2px}
.meta .uni{color:var(--accent);font-weight:700}
.eff{font-size:12.5px}
.eff small{display:block;font-size:12px}
.body{display:grid;grid-template-columns:minmax(0,34%) minmax(0,1fr);gap:10px;min-width:0}
.left,.right{display:grid;gap:8px;align-content:start;min-width:0}
.art{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--inset);display:grid;place-items:center}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.art .ph{font:700 13px var(--display);color:var(--muted);text-align:center;padding:8px}
.box{background:var(--inset);border-radius:8px;padding:8px 10px;min-width:0;font-size:12.5px}
.box h4{margin:0 0 2px;font-size:12px;font-weight:700}
.rate{display:grid;gap:5px}
.rate b{display:block;font-size:11.5px}
.stars{letter-spacing:1px;font-size:12.5px}
.stars .off{color:#ffffff33}
.box ul{margin:3px 0 0;padding-left:15px;display:grid;gap:3px}
.gold{color:var(--gold);font-style:normal;font-weight:700}
.verdict{display:grid;gap:4px}
.vpill{justify-self:start;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:1px 9px 1px 2px;border-radius:999px;color:#141414;background:var(--vc)}
.vpill img{width:18px;height:18px}
.vbar{display:inline-flex;align-items:center;gap:2px;padding:2px 4px;border:1px solid var(--line);border-radius:999px}
.vbtn{border:0;background:none;padding:2px;cursor:pointer;border-radius:50%;line-height:0;filter:grayscale(1) brightness(.6);opacity:.7;transition:filter .15s,opacity .15s,transform .15s}
.vbtn img{width:24px;height:24px}
.vbtn:hover{filter:none;opacity:1;transform:translateY(-1px)}
.vbtn.lit{filter:none;opacity:1}
.vbtn[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.vlbl{font-size:12px;font-weight:600;color:var(--muted);padding:0 8px 0 6px;white-space:nowrap}
.crumbs img{width:22px;height:22px;border-radius:50%}
.chip .ico{width:20px;height:20px;margin-left:-7px;border-radius:50%;object-fit:cover;transform:scale(1);clip-path:circle(46% at 50% 50%)}
.card h3 .tico{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
.verdict p{margin:0}
.bonus{display:flex;flex-wrap:wrap;gap:6px}
.bonus span{flex:1 1 60px;background:var(--inset);border-radius:8px;padding:6px 9px;display:flex;align-items:center;gap:5px;font-weight:700;font-size:12.5px}
.bonus img{width:15px;height:15px}
.bonus em{font-style:normal;color:var(--muted);font-weight:600;font-size:11px}
.empty{padding:60px var(--gut);color:var(--muted)}
.hint{color:var(--faint);font-size:12px;margin:0;padding-block:0 14px}
@media (max-width:640px){.search{width:100%}.sp{display:none}}
</style>
</head>

const VLABEL = {5:["Highly recommended","--v5"],4:["Recommended","--v4"],3:["Sidegrade","--v3"],2:["Bad","--v2"],1:["Very bad","--v1"]};
const STAT_ICON = {Speed:"status_00",Stamina:"status_01",Power:"status_02",Guts:"status_03",Wit:"status_04"};
const SP_ICON = "https://s3-us-west-2.amazonaws.com/public.notion-static.com/01249879-d648-48a2-b3c8-b368ffff1156/uma_sp_star.png";
const fmt = d => new Date(d+"T00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
const $ = s => document.querySelector(s);

// filter state, remembered per browser
const state = {q:"", types:new Set(), vmin:0};
try{const s=JSON.parse(localStorage.getItem("uma-end-filters")||"null"); if(s){state.q=s.q||"";state.types=new Set(s.types||[]);state.vmin=+s.vmin||0}}catch(e){}
const save=()=>{try{localStorage.setItem("uma-end-filters",JSON.stringify({...state,types:[...state.types]}))}catch(e){}};

// controls
TYPES.forEach(([t,c])=>{const b=document.createElement("button");b.className="chip";b.dataset.t=t;b.innerHTML=`<img class="ico" src="${TICON[t]}" alt="">${t}`;b.onclick=()=>{state.types.has(t)?state.types.delete(t):state.types.add(t);render()};$("#types").append(b)});
[1,2,3,4,5].forEach(r=>{const b=document.createElement("button");b.className="vbtn";b.dataset.r=r;b.title=r===5?VLABEL[5][0]:VLABEL[r][0]+" or better";b.setAttribute("aria-label",b.title);b.innerHTML=`<img src="${VICON[r]}" alt="">`;b.onclick=()=>{state.vmin=state.vmin===r?0:r;render()};$("#verdict").insertBefore(b,$("#vlbl"))});
$("#q").value=state.q; $("#q").oninput=e=>{state.q=e.target.value;render()};
$("#reset").onclick=()=>{state.q="";$("#q").value="";state.types.clear();state.vmin=0;render()};
$("#jump").onchange=e=>{const el=document.getElementById(e.target.value); if(el) scrollToEl(el,true); e.target.value=""};

// card markup (v1 callout layout)
const stars=n=>`<span class="stars" aria-label="${n} of 5">${"★".repeat(n)}<span class="off">${"★".repeat(5-n)}</span></span>`;
function cardHTML(c){
  const v=VLABEL[c.rank];
  const bonus=c.bonus.map(([s,val])=>`<span><img src="${s==="SP"?SP_ICON:TICON[s]}" alt="" onerror="this.remove()">${val}<em>${s}</em></span>`).join("");
  return `<article class="card" style="--tint:var(--t-${c.color})">
  <header><h3><img class="tico" src="${TICON[c.type]}" alt="${c.type}">${c.name} <span class="sub">· ${c.rarity} ${c.type}</span></h3>
    <div class="meta">${c.universal?'<span class="uni">universal</span>':""}</div></header>
  ${c.effects?`<div class="eff">${c.effects}<small>${c.start}</small></div>`:""}
  <div class="body">
    <div class="left">
      <div class="art"><img src="${c.img}" alt="${c.name}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:this.alt}))"></div>
      <div class="box rate"><div><b>Stats</b>${stars(c.stats)}</div><div><b>Skills</b>${stars(c.skills)}</div><div><b>Longevity</b>${c.longevity}</div></div>
    </div>
    <div class="right">
      ${c.unique?`<div class="box"><h4><span class="gold">★</span> Unique</h4>${c.unique}</div>`:""}
      ${c.keyskills.length?`<div class="box"><h4>Key skills</h4><ul>${c.keyskills.map(s=>`<li>${s}</li>`).join("")}</ul></div>`:""}
      <div class="box verdict" style="--vc:var(${v?v[1]:"--v0"})"><span class="vpill">${v?`<img src="${VICON[c.rank]}" alt="">`:""}${v?v[0]:"Unrated"}</span>${c.verdict.map(p=>`<p>${p}</p>`).join("")}</div>
    </div>
  </div>
  ${bonus?`<div class="bonus">${bonus}</div>`:""}
</article>`;
}

// timeline
const tl=$("#tl");
var render=function(){
  save();
  document.querySelectorAll("#types .chip").forEach(b=>b.setAttribute("aria-pressed",state.types.has(b.dataset.t)));
  document.querySelectorAll(".vbtn").forEach(b=>{const r=+b.dataset.r;b.classList.toggle("lit",!!state.vmin&&r>=state.vmin);b.setAttribute("aria-pressed",r===state.vmin)});
  $("#vlbl").textContent=!state.vmin?"Any verdict":state.vmin===5?"Highly recommended":VLABEL[state.vmin][0]+" or better";
  const q=state.q.trim().toLowerCase();
  const shown=CARDS.filter(c=>(!q||c.name.toLowerCase().includes(q))&&(!state.types.size||state.types.has(c.type))&&(!state.vmin||(c.rank||0)>=state.vmin));
  $("#count").textContent=`${shown.length} / ${CARDS.length} cards`;
  let html='<div class="spacer"></div>', todayDone=false, jump='<option value="">Jump to…</option><option value="today">Today</option>';
  SCENARIOS.forEach((s,i)=>{
    const cs=shown.filter(c=>c.scenario===s.name).sort((a,b)=>a.iso.localeCompare(b.iso)); if(!cs.length) return;
    jump+=`<option value="sc${i}">${s.name}</option>`;
    let cols="";
    cs.forEach(c=>{
      if(!todayDone&&c.iso>=TODAY){cols+=`<div class="today" id="today"><b>Today</b></div>`;todayDone=true}
      cols+=`<div class="col" data-iso="${c.iso}"><div class="when${c.iso<TODAY?" past":""}"><i></i><span>${c.date}</span></div>${cardHTML(c)}</div>`;
    });
    html+=`<section class="sc" id="sc${i}" style="--sc:${s.color}">
      <div class="sc-head"><h2>${s.name}</h2><small>${s.live?"live since "+fmt(s.start):"est. "+fmt(s.start)} · ${cs.length} card${cs.length>1?"s":""}</small></div>
      <div class="cards">${cols}</div></section>`;
  });
  if(!todayDone) html+=`<div class="today" id="today"><b>Today</b></div>`;
  tl.innerHTML=shown.length?html+'<div class="spacer"></div>':`<p class="empty">No card matches these filters.</p>`;
  $("#jump").innerHTML=jump;
  navState(); buildRuler();
}
function scrollToEl(el,smooth){
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  tl.scrollTo({left:Math.max(0,el.offsetLeft-$("#reader").offsetWidth-12),behavior:smooth&&!reduce?"smooth":"auto"});
}

// wheel → horizontal, arrows, keys
document.querySelector(".tl-wrap").addEventListener("wheel",e=>{
  if(Math.abs(e.deltaY)<=Math.abs(e.deltaX)||e.ctrlKey) return;            // trackpad sideways / zoom: leave alone
  const k=e.deltaMode===1?40:e.deltaMode===2?tl.clientWidth:1;            // lines / pages → pixels (Firefox)
  tl.scrollLeft+=e.deltaY*k; e.preventDefault();
},{passive:false});
const step=()=>Math.max(300,tl.clientWidth*0.8);
$("#prev").onclick=()=>tl.scrollBy({left:-step(),behavior:"smooth"});
$("#next").onclick=()=>tl.scrollBy({left:step(),behavior:"smooth"});
function navState(){ $("#prev").disabled=tl.scrollLeft<4; $("#next").disabled=tl.scrollLeft>tl.scrollWidth-tl.clientWidth-4 }
tl.addEventListener("scroll",()=>{navState();readRuler()},{passive:true}); addEventListener("resize",()=>{navState();buildRuler()});
tl.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){e.preventDefault();$("#next").click()} if(e.key==="ArrowLeft"){e.preventDefault();$("#prev").click()}});


// ---------- ruler: dates mapped piecewise onto the card columns
const DAY=864e5, ms=d=>Date.parse(d+"T00:00Z");
let anchors=[];  // [{x, t}] sorted, strictly increasing t
function buildRuler(){
  const old=tl.querySelector(".ruler"); if(old) old.remove();
  const cols=[...tl.querySelectorAll(".col")]; if(!cols.length){anchors=[];readRuler();return}
  const raw=cols.map(c=>({x:c.offsetLeft,t:ms(c.dataset.iso)}));
  anchors=[]; raw.forEach(a=>{ if(!anchors.length||a.t>anchors.at(-1).t) anchors.push(a) });
  const pxDay=4, first=anchors[0], last=anchors.at(-1);
  anchors.unshift({x:first.x-90*pxDay,t:first.t-90*DAY});
  anchors.push({x:last.x+parseFloat(getComputedStyle(cols[0]).width)+24, t:last.t+Math.round((parseFloat(getComputedStyle(cols[0]).width)+24)/pxDay)*DAY});
  const r=document.createElement("div"); r.className="ruler"; r.style.width=tl.scrollWidth+"px";
  let h=""; const start=new Date(Math.max(anchors[0].t,ms("2026-07-01"))), end=anchors.at(-1).t;
  for(let d=new Date(start); d.getTime()<=end; d.setUTCDate(d.getUTCDate()+1)){
    const x=xOf(d.getTime()); if(x<0) continue;
    const day=d.getUTCDate(), dens=pxPerDay(d.getTime());
    if(day===1){
      const m=d.toLocaleDateString("en-US",{month:"short",timeZone:"UTC"}), y=d.getUTCMonth()===0;
      h+=`<div class="tk mo" style="left:${x}px"></div><div class="lb${y?" yr":""}" style="left:${x}px">${y?m+" "+d.getUTCFullYear():m}</div>`;
    } else if(day%7===1 && dens>=1.2) h+=`<div class="tk wk" style="left:${x}px"></div>`;
    else if(dens>=4) h+=`<div class="tk" style="left:${x}px"></div>`;
  }
  SCENARIOS.forEach(s=>{ const t=ms(s.start); if(t>=anchors[0].t&&t<=end) h+=`<div class="flag" style="left:${xOf(t)}px;--sc:${s.color}"><span>${s.name}</span></div>` });
  h+=`<div class="now" style="left:${xOf(ms(TODAY))}px"></div>`;
  r.innerHTML=h; tl.prepend(r); readRuler();
}
function seg(t){ for(let i=0;i<anchors.length-1;i++) if(t<=anchors[i+1].t) return i; return anchors.length-2 }
function xOf(t){ const i=seg(t),a=anchors[i],b=anchors[i+1]; return a.x+(b.x-a.x)*(t-a.t)/(b.t-a.t) }
function pxPerDay(t){ const i=seg(t),a=anchors[i],b=anchors[i+1]; return (b.x-a.x)/((b.t-a.t)/DAY) }
function tOf(x){ for(let i=0;i<anchors.length-1;i++){const a=anchors[i],b=anchors[i+1]; if(x<=b.x) return a.t+(b.t-a.t)*Math.max(0,(x-a.x))/(b.x-a.x)} return anchors.at(-1).t }

// reader: needle position, date under it, scenario art appears when its start date is reached
const shot=$("#shot"), imgs={};
SCENARIOS.forEach(s=>{const i=new Image(); i.alt=""; i.src=s.img; i.onerror=()=>i.remove(); shot.prepend(i); imgs[s.name]=i});
let curSc=null;
function readRuler(){
  const reader=$("#reader"), needle=$("#needle");
  const nx=reader.offsetWidth; needle.style.left=nx+"px";
  if(anchors.length<2){$("#rdate").textContent="";return}
  const t=tOf(tl.scrollLeft+nx);
  const s=[...SCENARIOS].reverse().find(s=>t>=ms(s.start))||SCENARIOS[0];
  $("#rdate").textContent=new Date(t).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"});
  if(s!==curSc){
    curSc=s; reader.style.setProperty("--sc",s.color);
    $("#rname").textContent=s.name; $("#shotname").textContent=s.name;
    Object.entries(imgs).forEach(([n,i])=>i.classList.toggle("on",n===s.name));
  }
}

// keep the ruler in sync if anything changes size later (fonts, images)
let rto=0; const ro=new ResizeObserver(()=>{clearTimeout(rto);rto=setTimeout(buildRuler,120)});
const watch=()=>{ro.disconnect(); tl.querySelectorAll(".sc").forEach(s=>ro.observe(s))};
async function boot(){
  try{ const r=await fetch("data/end.json",{cache:"no-cache"}); if(!r.ok) throw new Error(r.status); CARDS=await r.json(); }
  catch(e){ tl.innerHTML='<p class="empty">Could not load the card data (data/end.json). Open the site through a web server, not as a local file.</p>'; return; }
  render(); watch();
  const _render=render; render=function(){_render();watch()};
  requestAnimationFrame(()=>{const t=document.getElementById("today"); const prev=t&&t.previousElementSibling; buildRuler(); scrollToEl(prev&&prev.classList.contains("col")?prev:(t||tl),false); navState(); readRuler()});
}
boot();
</script>
