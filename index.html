<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The site is dark by design: tell the browser and dark-mode extensions not to recolour it -->
<meta name="color-scheme" content="dark">
<meta name="darkreader-lock">
<title>Umapastèque · End Closer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/timeline.css">
<link rel="stylesheet" href="css/card.css">
<script type="module" src="js/main.js"></script>
</head>
<body>

<header class="pad mast">
  <h1>Umapast<span>è</span>que</h1>
  <nav class="crumbs" id="roles" aria-label="Running style"></nav>
</header>

<div class="bar">
  <div class="pad">
    <input class="search" id="q" type="search" placeholder="Search a card…" aria-label="Search a card">
    <div class="types" id="types" role="group" aria-label="Card type"></div>
    <div class="vbar" id="verdict" role="group" aria-label="Minimum verdict"><span class="vlbl" id="vlbl">Any verdict</span></div>
    <button class="link" id="reset">Reset</button>
    <span class="sp"></span>
    <select class="sel" id="jump" aria-label="Jump to"></select>
    <span class="count" id="count"></span>
  </div>
</div>

<div class="tl-wrap">
  <button class="nav prev" id="prev" aria-label="Scroll back">‹</button>
  <div class="reader" id="reader" aria-live="polite">
    <div class="shot" id="shot"><b id="shotname"></b></div>
    <div class="txt"><b id="rname"></b><small id="rdate"></small></div>
  </div>
  <div class="needle" id="needle"></div>
  <div class="tl" id="tl" tabindex="0" aria-label="Release timeline"></div>
  <button class="nav next" id="next" aria-label="Scroll forward">›</button>
</div>
<p class="pad hint">Scroll sideways: mouse wheel, arrow keys, or the ‹ › buttons. The ruler reads the date under the needle.</p>

</body>
</html>
