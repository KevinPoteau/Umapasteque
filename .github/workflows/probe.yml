name: Probe data sources (temporary)
on:
  push:
    branches: ["probe/sources"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/probe.py && ls -la probe/out
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B probe/results
          git add -f probe/out
          git commit -qm "Probe results"
          git push -f origin probe/results
