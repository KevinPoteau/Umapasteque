name: Check data

# Runs on every pull request (including the ones opened by the admin page):
# a red check means a data file has a problem; the log lists each one.
on:
  pull_request:
    paths: ["data/**", "scripts/validate_data.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/validate_data.py
