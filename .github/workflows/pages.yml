name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate card data
        run: |
          python3 - <<'PY'
          import json, glob
          for f in sorted(glob.glob("data/**/*.json", recursive=True)):
              d = json.load(open(f, encoding="utf-8"))
              print(f, len(d), "entries")
          PY
      # Fresh URLs on every deploy, so browsers never mix new and cached files
      - name: Add version to CSS, JS and data URLs
        run: python3 scripts/stamp_version.py "${GITHUB_SHA::8}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
