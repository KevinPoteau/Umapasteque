name: Store images in the repo

# Downloads card, scenario and role images into assets/ and opens a pull
# request with them. Runs when card data changes, or by hand.
on:
  push:
    branches: [main]
    paths: ["data/**", "scripts/fetch_assets.py"]
  workflow_dispatch:
    inputs:
      force:
        description: "Download again even if the file already exists"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fetch-assets
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download missing images
        run: python3 scripts/fetch_assets.py ${{ inputs.force && '--force' || '' }}
      # main is protected (changes go through pull requests), so the images
      # arrive as a PR to merge; merging it redeploys the site.
      - name: Open a pull request with the new images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add assets
          if git diff --cached --quiet; then
            echo "No new images."
            exit 0
          fi
          count=$(git diff --cached --name-only | wc -l)
          branch="bot/assets-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "Store $count images in assets/"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Store $count images in assets/" \
            --body "Downloaded by scripts/fetch_assets.py (run ${{ github.run_id }}). Merge to publish them; the site already falls back to the original URLs until then."
