name: Store images in the repo

# Downloads card, scenario and role images into assets/ and commits them,
# then redeploys the site. Runs when card data changes, or by hand.
on:
  push:
    branches: [main]
    paths: ["data/**", "scripts/fetch_assets.py"]
  workflow_dispatch:
    inputs:
      force:
        description: "Download again even if the file already exists"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: fetch-assets
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download missing images
        run: python3 scripts/fetch_assets.py ${{ inputs.force && '--force' || '' }}
      - name: Commit new images
        id: commit
        run: |
          git add assets
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new images."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Store images in assets/"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start the deploy explicitly
      - name: Redeploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
