name: Deploy site to the VPS

# Runs only once the VPS is set up: repository variable VPS_HOST, secrets
# VPS_SSH_KEY and VPS_KNOWN_HOSTS (see deploy/README.md). Until then every run
# is skipped and GitHub Pages stays the live site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps
  cancel-in-progress: false   # never cut a deploy halfway

jobs:
  deploy:
    if: vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    env:
      HOST: ${{ vars.VPS_HOST }}
      PORT: ${{ vars.VPS_PORT || '22' }}
      SITE: /var/www/umapasteque
    steps:
      - uses: actions/checkout@v7
      - name: Check the data
        run: python3 scripts/validate_data.py
      - name: Add version to CSS, JS and data URLs
        run: python3 scripts/stamp_version.py "${GITHUB_SHA::8}"
      - name: SSH key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      # Each deploy goes to its own folder, then "current" switches to it in
      # one step: visitors never see half a site. Unchanged files are hard
      # links to the previous release, so the pictures take no extra space.
      - name: Upload
        run: |
          rsync -az --delete -e "ssh -p $PORT" \
            --exclude=.git --exclude=.github --exclude=scripts --exclude=deploy \
            --exclude='__pycache__' --exclude='*.md' \
            --link-dest="$SITE/current/" \
            ./ "deploy@$HOST:$SITE/releases/$GITHUB_SHA/"
      - name: Switch to the new release, keep the last 5
        run: |
          ssh -p "$PORT" "deploy@$HOST" "set -e; cd $SITE
            ln -sfn releases/$GITHUB_SHA current.new && mv -T current.new current
            ls -1dt releases/*/ | grep -v "/$GITHUB_SHA/" | tail -n +5 | xargs -r rm -rf"
